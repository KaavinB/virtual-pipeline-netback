# ── fuel market: sell gas as a diesel substitute to an in-basin customer ──────
# (drilling rigs, frac fleets, off-grid power). Priced at diesel parity on an LHV basis, less a
# discount the customer needs to bother switching. No public price series exists for this.
- key: fuel_discount_to_diesel
  value: 0.40
  low: 0.20
  high: 0.60
  unit: fraction
  basis: rough_estimate
  source: "Share of diesel-parity value given up to win the customer: covers their dual-fuel conversion, substitution limits, and the fact that off-road diesel is untaxed."

- key: fuel_customer_one_way_mi
  value: 50
  low: 10
  high: 150
  unit: mi
  basis: rough_estimate
  source: "Typical haul from a flaring pad to a rig or frac fleet in the same basin. Customer locations are not public, so this is a single adjustable distance, not a routed one."

- key: lng_delivery_as_fuel
  value: 0.20
  low: 0.20
  high: 0.26
  unit: usd_per_mmbtu
  basis: sourced
  usd_year: 2015
  source: "World Bank GGFR, Comparison of mini-micro LNG and CNG (2016): delivery of LNG in liquid form 0.2 USD/MMBtu (vs 0.5-1.5 regasified)"
  url: https://documents1.worldbank.org/curated/en/795991484736761603/pdf/112132-WP-ComparisonofMiniLNGandCNGforcommercializingsmallvolumesofassociatedgas-PUBLIC-v2.pdf

