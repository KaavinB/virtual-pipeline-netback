# ── trucking ─────────────────────────────────────────────────────────────────
- key: truck_mpg
  value: 6.30
  low: 5.30
  high: 7.30
  unit: mi_per_gal
  basis: sourced
  source: "DOE AFDC average fuel economy, Class 8 truck: 6.3048 mpg (FHWA Highway Statistics 2024, Table VM-1)"
  url: https://afdc.energy.gov/data/10310
  note: "low/high = +/- 1 mpg (rough): a fully loaded truck on lease roads is below the fleet average"

- key: nonfuel_usd_per_mile
  value: 1.854
  low: 1.483
  high: 2.225
  unit: usd_per_mile
  basis: sourced
  usd_year: 2025
  source: "ATRI, An Analysis of the Operational Costs of Trucking (2026, 2025 data): $2.336/mi total, $1.854/mi excluding fuel"
  url: https://www.ttnews.com/articles/atri-truck-costs-2025
  note: "low/high = +/- 20% (rough). ATRI covers general freight; hazmat and cryogenic hauling likely costs more."

- key: last_mile_factor
  value: 1.0
  low: 1.0
  high: 1.5
  unit: ratio
  basis: rough_estimate
  source: "Multiplier on the straight-line gap between a flare and the nearest mapped road (OSRM snap distance). 1.0 is a lower bound; lease roads wind."

- key: route_distance_factor
  value: 1.0
  low: 0.75
  high: 1.25
  unit: ratio
  basis: rough_estimate
  source: "Multiplier on routed hub miles. Below 1: the gas is delivered to a nearer pipeline interconnect than the named hub; above 1: detours, permitted truck routes."

- key: diesel_region
  value_text: PADD3
  unit: region_code
  basis: sourced
  source: "EIA weekly No. 2 diesel retail, Gulf Coast (PADD 3): Texas and New Mexico are both in PADD 3"

# ── processing and fixed costs: World Bank GGFR, 3 MMscf/d onshore scenarios ─
# The smallest GGFR scenario is 3 MMscf/d; the sites here flare 0.24-1.93 MMscf/d, so unit
# costs are likely higher. `low` = GGFR's 10 MMscf/d scenario; `high` = +30% (rough).
- key: cng_gas_treatment
  value: 0.42
  low: 0.21
  high: 0.55
  unit: usd_per_mmbtu
  basis: sourced
  usd_year: 2015
  source: "World Bank GGFR CNG report (2016), onshore truck 3 MMscf/d: gas treatment 0.42 USD2015/MMBtu"
  url: https://documents1.worldbank.org/curated/en/210571472125529218/pdf/104200-V2-WP-CNG-commercialization-PUBLIC-Main-report-REPLACEMENT.pdf

- key: cng_compression
