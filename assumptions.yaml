# Every number the model uses that is not an observed market price.
#
#   basis:     sourced         - a published figure, quoted as published
#              derived         - arithmetic on sourced figures (shown in `note`)
#              rough_estimate  - no public source; a judgment call, labelled as such
#   usd_year:  dollar year of the figure. 2015-dollar World Bank costs are escalated to 2025
#              dollars in SQL (mart.v_assumption) with the BLS CPI-U values below.
#   low/high:  the range swept by the sensitivity analysis (Step 8) and the dashboard sliders.
#
# Loaded into core.assumption by `make assumptions`. Edit here, never in the database.

# ── delivered price = Henry Hub (daily, EIA) + basis ──────────────────────────
- key: basis_waha
  value: -2.07
  low: -2.37
  high: -0.42
  unit: usd_per_mmbtu
  basis: sourced
  source: "EIA Today in Energy, 2024-09-10: Waha averaged $2.07/MMBtu below Henry Hub in 2024 to date (NGI data)"
  url: https://www.eia.gov/todayinenergy/detail.php?id=63044
  note: "high = H2 2021 average gap of $0.42 (same EIA article). low = 2025: Waha $1.15 avg (Reuters/LSEG, trade press, unverified) minus EIA's $3.52 Henry Hub avg."

- key: basis_agua_dulce
  value: -0.40
  low: -0.60
  high: -0.20
  unit: usd_per_mmbtu
  basis: rough_estimate
  source: "No public daily series. NGI trade press (paywalled, unverified) reports Agua Dulce 25-49 cents under Henry Hub in 2025-26 spot and forward markets."
  url: https://www.naturalgasintel.com/services/ngi-price-index-data/

- key: basis_katy
  value: -0.30
  low: -1.00
  high: -0.10
  unit: usd_per_mmbtu
  basis: rough_estimate
  source: "No public daily series. Trade press (unverified): Katy usually under $0.20 below Henry Hub, about $1 below during the 2022-23 Freeport LNG outage, ~47 cents below in winter 2026/27 forwards."
  url: https://www.ice.com/products/59293792/Katy-Basis-Future

