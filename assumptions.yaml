  url: https://documents1.worldbank.org/curated/en/210571472125529218/pdf/104200-V2-WP-CNG-commercialization-PUBLIC-Main-report-REPLACEMENT.pdf

- key: cng_delivery
  value: 0.50
  low: 0.50
  high: 0.65
  unit: usd_per_mmbtu
  basis: sourced
  usd_year: 2015
  source: "World Bank GGFR CNG report (2016): delivery (offloading, heating, let-down, metering) 0.50 USD2015/MMBtu"
