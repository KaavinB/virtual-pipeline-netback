[project]
name = "vpv-netback"
version = "0.1.0"
description = "Virtual-pipeline netback model: CNG/LNG trucking economics for stranded Permian and Eagle Ford gas"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the Postgres container (make up)",
    "data: needs real data loaded (make all); skipped on an empty database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# dashboard card definitions are SQL strings; wrapping them mid-clause hurts readability
"dashboards/metabase/provision.py" = ["E501"]
