services:
  db:
    image: postgres:17
    container_name: vpv-db
    environment:
      POSTGRES_USER: ${PGUSER:-vpv}
      POSTGRES_PASSWORD: ${PGPASSWORD:-vpv}
      POSTGRES_DB: ${PGDATABASE:-vpv}
    ports:
      # host 5434: avoids a local Postgres (5432) and other projects' containers
      - "${PGPORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # BI layer (only with `--profile bi`, i.e. `make dashboard`). Reads the mart views live.
  metabase:
    image: metabase/metabase:v0.64.1
    container_name: vpv-metabase
    profiles: ["bi"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # Metabase's own settings (H2), not our data
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
    ports:
      - "3000:3000"
    volumes:
      - mbdata:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  mbdata:
